name: Train LSTM Model

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted
    # La laptop bloquea los scripts de PowerShell (política de ejecución); cmd no se ve afectado.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      # Se usa el Python ya instalado en la laptop (setup-python necesita PowerShell).
      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        env:
          MPLBACKEND: Agg
        run: python train.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: predicciones
          path: predicciones.png
