name: Train LSTM Model

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # En la laptop (Windows) se usa el Python ya instalado: setup-python ejecuta un
      # script .ps1 que la política de ejecución de PowerShell bloquea.
      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        env:
          MPLBACKEND: Agg
        run: python train.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: predicciones
          path: predicciones.png
